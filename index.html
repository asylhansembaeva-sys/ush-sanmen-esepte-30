<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#783bd6"><title>ҮШ САНМЕН ЕСЕПТЕ! — 30 тапсырма</title><style>
:root{font-family:'Times New Roman',serif;color:#18234b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffe7f5,#e7f4ff 52%,#fff1bd);padding:18px}.app{max-width:1080px;margin:auto;background:#ffffffed;border:5px solid #a56bff;border-radius:30px;box-shadow:0 14px 35px #5936a733;padding:20px 24px 28px}h1{margin:0;text-align:center;font-size:clamp(32px,5.5vw,59px);font-weight:900;color:#9c1576;text-shadow:1px 2px #ffe67c}.instructions{text-align:center;font-size:clamp(23px,3.4vw,35px);font-weight:900;color:#1649ad;margin:12px auto 16px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:clamp(21px,2.8vw,29px);font-weight:900}.count,.score{padding:9px 17px;border-radius:16px;background:#e7d7ff}.score{background:#d8f8dd}.equation{background:#fff5ca;border:4px solid #eab646;border-radius:26px;min-height:185px;margin:18px 0;display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,22px);flex-wrap:wrap;padding:20px 10px;font-size:clamp(43px,8vw,91px);font-weight:900;color:#0c1645;letter-spacing:0}.eqnum{white-space:nowrap}.answer{min-width:1.35em;min-height:1.2em;display:inline-flex;align-items:center;justify-content:center;border-bottom:7px solid #a15be0;color:#118744}.answer.blank{color:transparent}.picktitle{text-align:center;font-size:clamp(24px,3.5vw,38px);font-weight:900;color:#a51a67;margin:15px 0}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.choice{font-family:inherit;font-size:clamp(35px,6vw,64px);font-weight:900;color:#121527;border:3px solid #34343450;border-radius:20px;min-height:88px;cursor:pointer;touch-action:manipulation;box-shadow:0 5px #0002;transition:transform .12s,filter .12s}.choice:active{transform:translateY(4px)}.choice:disabled{cursor:default;opacity:.65}.choice.correct{outline:5px solid #17863c;opacity:1}.choice.wrong{animation:shake .24s}.status{text-align:center;min-height:57px;font-size:clamp(25px,3.5vw,37px);font-weight:900;color:#13804d;padding:8px}.status.bad{color:#c22d4b}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.action{font-family:inherit;border:0;border-radius:18px;padding:12px 28px;font-size:clamp(23px,3vw,32px);font-weight:900;background:#763be1;color:white;cursor:pointer;box-shadow:0 5px #442c8d}.action.secondary{background:#ee7b23;box-shadow:0 5px #a34d12}.action:disabled{opacity:.42;cursor:default}.navtitle{text-align:center;font-size:clamp(20px,2.7vw,29px);font-weight:900;color:#8324a8;margin:19px 0 9px}.tasknav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.tasknum{font-family:inherit;font-weight:900;font-size:clamp(19px,2.6vw,29px);min-height:47px;border:2px solid #7553b0;border-radius:12px;background:#eee3ff;color:#281451;cursor:pointer;touch-action:manipulation}.tasknum.current{background:#ffcb55;outline:3px solid #b46b00}.tasknum.done{background:#4ac982;color:#083b24;border-color:#168b49}.tasknum.missed{background:#ffb8cb;border-color:#ca3b65}.startpanel{text-align:center;font-size:clamp(24px,3vw,35px);font-weight:900;color:#922174;padding:30px 8px}.clock{padding:9px 17px;border-radius:16px;background:#ffe1a2;color:#7c2811;font-variant-numeric:tabular-nums}.progress{height:15px;border-radius:20px;background:#e5e2ee;margin-top:18px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#25bb76,#70d642);transition:width .2s}.finish{text-align:center;padding:30px 5px;font-size:clamp(27px,4vw,44px);font-weight:900;color:#176b40}.hidden{display:none!important}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:560px){body{padding:7px}.app{border-width:3px;border-radius:18px;padding:13px 10px}.equation{min-height:145px;gap:7px;padding:15px 5px;margin:14px 0}.choices{gap:7px}.choice{min-height:69px;border-radius:12px}.action{padding:11px 18px}.tasknav{grid-template-columns:repeat(5,minmax(0,1fr))}.tasknum{min-height:45px}}
</style></head><body><main class="app"><h1>ҮШ САНМЕН ЕСЕПТЕ!</h1><p class="instructions">Өрнектің мәнін тап! Дұрыс жауапты таңда!</p><div class="top"><span class="count" id="counter">1 / 30</span><span class="score" id="score">Дұрыс: 0</span><span class="clock" id="clock">⏱ 00:00 🔊</span></div><section id="startpanel" class="startpanel"><p>Уақытты бастау үшін батырманы бас!</p><button class="action" id="start">БАСТАУ ▶</button></section><section id="play" class="hidden"><div class="equation" id="equation" aria-live="polite"></div><div class="picktitle">ДҰРЫС ЖАУАПТЫ ТАҢДА!</div><div class="choices" id="choices"></div><div class="status" id="status" aria-live="polite"></div><div class="actions"><button class="action" id="next">КЕЛЕСІ ➜</button></div></section><section id="finish" class="finish hidden"><div id="summary"></div><button class="action" id="restart">ҚАЙТА ОЙНАУ ↻</button></section><div class="progress"><div class="bar" id="bar"></div></div></main><script>
'use strict';
// All calculations are evaluated from left to right; intermediate and final values stay within 0..10.
const tasks=[
[6,'+',3,'-',4],[10,'-',4,'+',2],[5,'+',4,'-',3],[9,'-',5,'+',3],[7,'+',2,'-',6],
[8,'-',3,'+',4],[4,'+',5,'-',7],[10,'-',6,'+',5],[3,'+',6,'-',2],[9,'-',4,'+',1],
[2,'+',7,'-',5],[8,'-',6,'+',7],[5,'+',3,'-',6],[10,'-',7,'+',4],[6,'+',4,'-',8],
[9,'-',3,'+',2],[4,'+',4,'-',5],[7,'-',2,'+',3],[1,'+',8,'-',4],[10,'-',8,'+',6],
[3,'+',5,'-',1],[8,'-',4,'+',5],[6,'+',2,'-',3],[9,'-',7,'+',6],[5,'+',5,'-',9],
[10,'-',5,'+',4],[2,'+',6,'-',7],[7,'-',4,'+',6],[4,'+',3,'-',2],[9,'-',6,'+',5]
].map(([a,op1,b,op2,c])=>({a,op1,b,op2,c,result:(op1==='+'?a+b:a-b)+(op2==='+'?c:-c)}));
let index=0,completed=new Set(),locked=false,ctx=null,seconds=0,ticker=null,started=false;const $=id=>document.getElementById(id);const colors=['#ffd76b','#a8e8ff','#ffb6d5','#b8f29b','#d9c2ff','#ffcb8c','#a9e5d4','#f4b3fa','#f7eb8b','#b6d2ff'];
function beep(ok){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume();const start=ctx.currentTime+.01;const notes=ok?[660,880,1100]:[330,220];notes.forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=start+i*(ok?.105:.15);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.22:.19,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
function choiceNumbers(answer){const pool=Array.from({length:11},(_,i)=>i).filter(n=>n!==answer).sort((a,b)=>Math.abs(a-answer)-Math.abs(b-answer));const vals=[answer,...pool.slice(0,3)];for(let i=vals.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}return vals}
function render(){if(index>=tasks.length){end();return}locked=completed.has(index);$('play').classList.remove('hidden');$('finish').classList.add('hidden');const t=tasks[index];$('counter').textContent=`${index+1} / ${tasks.length}`;$('score').textContent=`Дұрыс: ${completed.size}`;$('bar').style.width=(completed.size/tasks.length*100)+'%';$('equation').innerHTML=`<span class="eqnum">${t.a}</span><span>${t.op1}</span><span class="eqnum">${t.b}</span><span>${t.op2}</span><span class="eqnum">${t.c}</span><span>=</span><span class="answer ${locked?'':'blank'}" id="answer">${locked?t.result:'0'}</span>`;$('status').textContent=locked?'Жарайсың! Дұрыс!':'';$('status').className='status';$('next').disabled=!locked;$('next').textContent='КЕЛЕСІ ➜';$('choices').innerHTML='';choiceNumbers(t.result).forEach((n,i)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=n;b.style.background=colors[(i+index)%colors.length];b.disabled=locked;b.addEventListener('click',()=>answer(n,b));$('choices').appendChild(b)})}
function answer(n,b){if(locked)return;const t=tasks[index];if(n===t.result){locked=true;completed.add(index);$('answer').textContent=n;$('answer').classList.remove('blank');$('status').textContent='ЖАРАЙСЫҢ! ДҰРЫС!';$('status').className='status';b.classList.add('correct');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('next').disabled=false;$('score').textContent=`Дұрыс: ${completed.size}`;$('bar').style.width=(completed.size/tasks.length*100)+'%';beep(true)}else{$('status').textContent='ҚАТЕ! ҚАЙТА ОЙЛАН!';$('status').className='status bad';b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');beep(false)}}
function advance(){if(!locked)return;if(index<tasks.length-1){index++;render()}else{end()}window.scrollTo({top:0,behavior:'smooth'})}
function end(){ stopTimer();$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('counter').textContent='30 / 30';$('bar').style.width='100%';$('summary').textContent=`🎉 ЖАРАЙСЫҢ! БАРЛЫҚ ${tasks.length} ТАПСЫРМАНЫ ОРЫНДАДЫҢ!`; }
$('next').addEventListener('click',advance);
function clockText(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('clock').textContent=`⏱ ${m}:${s} 🔊`}
function tickSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=920;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.085);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.09)}catch(e){}}
function stopTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function startGame(){stopTimer();seconds=0;clockText();index=0;completed.clear();locked=false;started=true;$('startpanel').classList.add('hidden');$('play').classList.remove('hidden');try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!ctx)ctx=new AC();ctx.resume()}}catch(e){};render();ticker=setInterval(()=>{seconds++;clockText();tickSound()},1000)}
$('start').addEventListener('click',startGame);
$('restart').addEventListener('click',startGame);clockText();
</script></body></html>
